<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revizz</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/c9ff690dfa.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <main class="main-container">

      <!-- En-tête principal (avec titre et bouton des paramètres) -->
      <header>
        <h1>Revizz</h1>
        <button
          id="params-btn"
          class="params-btn"
          aria-label="Ouvrir le menu des paramètres"
        >
          <i class="fa-solid fa-gear"></i>
        </button>
      </header>

      <!-- Fenêtre modale pour les paramètres (configuration du quiz) -->
      <dialog id="params-modal" class="params-modal">
        <form id="params-form" class="params-form">
          <h2>Paramètres du quiz</h2>

          <fieldset>
            <legend>Nombre de questions :</legend>
            <label
              ><input type="radio" name="size" value="5" checked /> 5
              questions</label
            >
            <label
              ><input type="radio" name="size" value="10" /> 10 questions</label
            >
            <label
              ><input type="radio" name="size" value="20" /> 20 questions</label
            >
          </fieldset>

          <fieldset>
            <legend>Thème :</legend>
            <label for="theme1"
              ><input
                type="checkbox" id="theme1" name="theme1" value="maths-3e" checked
              /> Maths 3<sup>e</sup></label
            >
            <label for="theme2"
              ><input type="checkbox" id="theme2" name="theme2" value="maths-2de" /> Maths
              2<sup>de</sup></label
            >
            <label for="theme3"
              ><input type="checkbox" id="theme3" name="theme3" value="physics-3e" /> Physique 3<sup>e</sup></label
            >
          </fieldset>

          <div>
            <button type="submit" class="btn">Valider et relancer</button>
            <button type="button" id="close-modal-btn" class="btn">
              Annuler
            </button>
          </div>
        </form>
      </dialog>

      <!-- Zone de jeu principale -->
      <p id="question" class="question"></p>
      <ul id="answers-list" class="answers-list"></ul>

      <!-- Zone de fin de partie et correction du quiz -->
      <p id="result" class="result"></p>
      <ul id="review-quiz-list" class="review-quiz-list"></ul>
      <button id="review-quiz-btn" class="btn">Voir le corrigé</button>
      <button id="restart-btn" class="btn">Rejouer</button>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
